name: UnraidDrive
options:
  bundleIdPrefix: com.sidimam
  deploymentTarget:
    iOS: "17.0"
    visionOS: "1.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 3B344DJ2L5
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2,7"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  UnraidGatewayKit:
    path: Packages/UnraidGatewayKit
targets:
  UnraidDrive:
    type: application
    supportedDestinations: [iOS, visionOS]
    sources:
      - path: App
        excludes: ["Info.plist"]
    dependencies:
      - package: UnraidGatewayKit
      - target: UnraidDriveFileProvider
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Unraid Drive
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: App/UnraidDrive.entitlements
      properties:
        com.apple.security.application-groups: [group.com.sidimam.unraiddrive]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidimam.unraiddrive
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  UnraidDriveFileProvider:
    type: app-extension
    supportedDestinations: [iOS, visionOS]
    sources:
      - path: FileProvider
        excludes: ["Info.plist"]
    dependencies:
      - package: UnraidGatewayKit
      - sdk: FileProvider.framework
    info:
      path: FileProvider/Info.plist
      properties:
        CFBundleDisplayName: Unraid Drive
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          NSExtensionFileProviderSupportsEnumeration: true
          NSExtensionFileProviderDocumentGroup: group.com.sidimam.unraiddrive
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: FileProvider/UnraidDriveFileProvider.entitlements
      properties:
        com.apple.security.application-groups: [group.com.sidimam.unraiddrive]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidimam.unraiddrive.fileprovider
schemes:
  UnraidDrive:
    build:
      targets:
        UnraidDrive: all
        UnraidDriveFileProvider: all
    run:
      config: Debug
    test:
      config: Debug
      targets: []
