name: UnraidDrive
options:
  developmentLanguage: en
  bundleIdPrefix: com.sdimambro
  deploymentTarget:
    iOS: "17.0"
    visionOS: "1.0"
    macOS: "14.0"
    tvOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEVELOPMENT_TEAM: X5SR67A8AL
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2,7"
    MARKETING_VERSION: "1.3"
    # MPVKit ships arm64-only slices for the visionOS simulator.
    "EXCLUDED_ARCHS[sdk=xrsimulator*]": x86_64
    CURRENT_PROJECT_VERSION: "28"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  UnraidGatewayKit:
    path: Packages/UnraidGatewayKit
  # libmpv + FFmpeg (LGPL build) for Apple TV: plays what AVPlayer cannot (MKV, AVI, FLAC, …).
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    exactVersion: 1.0.0
targets:
  UnraidDrive:
    type: application
    supportedDestinations: [iOS, visionOS]
    sources:
      - path: Shared
      - path: App
        excludes: ["Info.plist", "Info-macOS.plist", "UnraidDrive-macOS.entitlements"]
    dependencies:
      - package: MPVKit
        product: MPVKit
      - package: UnraidGatewayKit
      - target: UnraidDriveFileProvider
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Unraid Drive
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [fetch]
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.sdimambro.unraid-drive.openFiles
            UIApplicationShortcutItemTitle: Open the Files app
            UIApplicationShortcutItemIconSymbolName: folder
          - UIApplicationShortcutItemType: com.sdimambro.unraid-drive.testConnection
            UIApplicationShortcutItemTitle: Test connection
            UIApplicationShortcutItemIconSymbolName: stethoscope
          - UIApplicationShortcutItemType: com.sdimambro.unraid-drive.addServer
            UIApplicationShortcutItemTitle: Add server
            UIApplicationShortcutItemIconSymbolName: plus
        BGTaskSchedulerPermittedIdentifiers: [com.sdimambro.unraid-drive.refresh]
        CFBundleURLTypes:
          - CFBundleURLName: com.sdimambro.unraid-drive
            CFBundleURLSchemes: [unraiddrive]
    entitlements:
      path: App/UnraidDrive.entitlements
      properties:
        com.apple.security.application-groups: [group.com.sdimambro.unraid-drive]
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sdimambro.unraid-drive
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDrive
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        "ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES[sdk=iphone*]": "AppIcon-rosso AppIcon-blu AppIcon-teal AppIcon-viola AppIcon-grafite"
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=xros*]": AppIconVision
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=xrsimulator*]": AppIconVision
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  UnraidDriveFileProvider:
    type: app-extension
    supportedDestinations: [iOS, visionOS]
    sources:
      - path: FileProvider
        excludes: ["Info.plist", "Info-macOS.plist", "Resources", "UnraidDriveFileProvider-macOS.entitlements"]
    dependencies:
      - package: UnraidGatewayKit
      - sdk: FileProvider.framework
    info:
      path: FileProvider/Info.plist
      properties:
        CFBundleDisplayName: Unraid Drive
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          NSExtensionFileProviderSupportsEnumeration: true
          NSExtensionFileProviderDocumentGroup: group.com.sdimambro.unraid-drive
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: FileProvider/UnraidDriveFileProvider.entitlements
      properties:
        com.apple.security.application-groups: [group.com.sdimambro.unraid-drive]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sdimambro.unraid-drive.fileprovider
  UnraidDriveMac:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: App
        excludes: ["Info.plist", "Info-macOS.plist", "UnraidDrive.entitlements"]
    dependencies:
      - package: MPVKit
        product: MPVKit
      - package: UnraidGatewayKit
      - target: UnraidDriveFileProviderMac
    entitlements:
      path: App/UnraidDrive-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [group.com.sdimambro.unraid-drive]
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    settings:
      base:
        INFOPLIST_FILE: App/Info-macOS.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.sdimambro.unraid-drive
        PRODUCT_NAME: Unraid Drive
        PRODUCT_MODULE_NAME: UnraidDrive
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconMac
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
  UnraidDriveFileProviderMac:
    type: app-extension
    platform: macOS
    sources:
      - path: FileProvider
        excludes: ["Info.plist", "Info-macOS.plist", "UnraidDriveFileProvider.entitlements"]
    dependencies:
      - package: UnraidGatewayKit
      - sdk: FileProvider.framework
    info:
      path: FileProvider/Info-macOS.plist
      properties:
        CFBundleDisplayName: Unraid Drive
        CFBundleName: Unraid Drive
        CFBundleIconFile: FPIcon
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleSymbolName: unraid.drive
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          NSExtensionFileProviderSupportsEnumeration: true
          NSExtensionFileProviderDocumentGroup: group.com.sdimambro.unraid-drive
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: FileProvider/UnraidDriveFileProvider-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [group.com.sdimambro.unraid-drive]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sdimambro.unraid-drive.fileprovider
        PRODUCT_NAME: UnraidDriveFileProvider
        PRODUCT_MODULE_NAME: UnraidDriveFileProvider
        ASSETCATALOG_COMPILER_APPICON_NAME: FPIcon
        ENABLE_HARDENED_RUNTIME: YES
  UnraidDriveTV:
    type: application
    platform: tvOS
    sources:
      - path: TV
      - path: Shared
      - path: App/Localizable.xcstrings
      - path: App/Resources/Assets.xcassets
    dependencies:
      - package: UnraidGatewayKit
      - package: MPVKit
        product: MPVKit
    info:
      path: TV/Info.plist
      properties:
        CFBundleDisplayName: Unraid Drive
        CFBundleName: Unraid Drive
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIUserInterfaceStyle: Automatic
    entitlements:
      path: TV/UnraidDriveTV.entitlements
      properties:
        com.apple.security.application-groups: [group.com.sdimambro.unraid-drive]
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sdimambro.unraid-drive
        PRODUCT_NAME: Unraid Drive
        PRODUCT_MODULE_NAME: UnraidDriveTV
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconTV
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "3"
      configs:
        # No Apple TV is registered, so there is no development profile: Release archives sign
        # directly with the App Store profile created through the API (manual signing, this target only).
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: UnraidDrive tvOS AppStore
schemes:
  UnraidDriveTV:
    build:
      targets:
        UnraidDriveTV: all
    run:
      config: Debug
    test:
      config: Debug
      targets: []
  UnraidDriveMac:
    build:
      targets:
        UnraidDriveMac: all
        UnraidDriveFileProviderMac: all
    run:
      config: Debug
    test:
      config: Debug
      targets: []
  UnraidDrive:
    build:
      targets:
        UnraidDrive: all
        UnraidDriveFileProvider: all
    run:
      config: Debug
    test:
      config: Debug
      targets: []
